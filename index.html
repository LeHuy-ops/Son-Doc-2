<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Công Trình Thủy Lợi</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #eef4f8; }
        header { background: #0b6db8; color: white; padding: 20px; }
        
        /* Bố cục header với logo và chữ */
        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap; /* tự xuống dòng khi màn hình nhỏ */
            text-align: center;
        }

        .logo {
            height: 150px; /* chỉnh kích thước logo */
        }

        .header-text h1 {
            margin: 0;
            font-size: 24px;
        }
        .header-text p {
            margin: 15px;
            font-size: 50px;
        }
        .container { width: 98%; max-width: 100%; margin: auto; padding: 20px 0; }
        .card { background: white; margin: 0 auto 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 95%; }
        .card h2 { color: #0b6db8; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; font-size: 24px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .info-item { font-size: 16px; border-bottom: 1px dashed #eee; padding: 8px 0; }
        .label { font-weight: bold; color: #555; display: inline-block; width: 200px; }
        .map-box { margin-top: 20px; border-radius: 12px; overflow: hidden; border: 2px solid #0b6db8; }
        @media (max-width: 768px) { 
            .info-grid { grid-template-columns: 1fr; } 
            .card { width: 92%; padding: 15px; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-content">
        <!-- Logo công ty -->
        <img src="LOGO.png" alt="Logo Công ty" class="logo">
        <div class="header-text">
            <h1>CÔNG TY TRÁCH NHIỆM HỮU HẠN MỘT THÀNH VIÊN KHAI THÁC CÔNG TRÌNH THỦY LỢI BẾN TRE</h1>
            <p>THÔNG TIN CÔNG TRÌNH</p>
        </div>
    </div>
</header>
<div class="container" id="list">Đang tải dữ liệu...</div>
<script>
    fetch("CT 050.xlsx")
    .then(res => {
        if(!res.ok) throw new Error("Không tìm thấy file Excel 'CT 001.xlsx'");
        return res.arrayBuffer();
    })
    .then(data => {
        const wb = XLSX.read(data, {type: "array"});
        const ws = wb.Sheets["Cống CN1"]; 
        const rows = XLSX.utils.sheet_to_json(ws, { range: 2 });

        let html = "";
        rows.forEach(item => {
            const address = item["ĐỊA ĐIỂM"] || "Bến Tre";
            const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(address)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            html += `
            <div class="card">
                <h2>${item["MCT"] || "KM"} - ${item["TÊN CÔNG TRÌNH"] || "N/A"}</h2>
                <div class="info-grid">
                    <div class="info-item"><span class="label">📍 Địa điểm:</span> ${item["ĐỊA ĐIỂM"] || ""}</div>
                    <div class="info-item"><span class="label">📅 Năm xây dựng:</span> ${item["NĂM XÂY DỰNG"] || ""}</div>
                    <div class="info-item"><span class="label">⚙️ Tình trạng:</span> ${item["TRẠNG THÁI HOẠT ĐỘNG"] || ""}</div>
                    <div class="info-item"><span class="label">🚪 Số cửa:</span> ${item["SỐ CỬA"] || ""}</div>
                    <div class="info-item"><span class="label">📏 Khẩu độ:</span> ${item["KHẨU ĐỘ"] || ""}</div>
                    <div class="info-item"><span class="label">🏗️ Loại:</span> ${item["PHÂN LOẠI CÔNG TRÌNH"] || ""}</div>
                    <div class="info-item"><span class="label">📌 Vùng phụ cận (m):</span> ${item["VÙNG PHỤ CẬN"] || ""}</div>
                    <div class="info-item"><span class="label">👤 Quản lý:</span> ${item["NHÂN VIÊN QUẢN LÝ"] || ""}</div>
                    <div class="info-item"><span class="label">📞 SĐT:</span> ${item["SĐT"] || ""}</div>
                    <div class="info-item"><span class="label">📅 Ngày kiểm tra:</span> ${item["NGÀY KIỂM TRA"] || ""}</div>
                    <div class="info-item"><span class="label">📋 Nội dung:</span> ${item["NỘI DUNG"] || ""}</div>
                    
                    <div class="info-item">
                      <span class="label">📅 Tài liệu:</span>
                      ${
                        item["GIỚI THIỆU CÔNG TRÌNH"]
                          ? item["GIỚI THIỆU CÔNG TRÌNH"].split(/[,;]+/).map((link, i) => 
                              `<a href="${link.trim()}" target="_blank">Tài liệu ${i+1}</a>`
                            ).join(" | ")
                          : ""
                      }
                    </div>
                </div>
                <div class="map-box">
                   <iframe
                   src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d2093.944628074404!2d106.45969343887784!3d10.068608523530434!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMTDCsDA0JzA2LjMiTiAxMDbCsDI3JzMwLjYiRQ!5e1!3m2!1svi!2s!4v1777617304323!5m2!1svi!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                   width="100%"
                   height="400"
                   style="border:0;border-radius:10px;"
                   loading="lazy"></iframe>
                </div>
            </div>`;
        });

        document.getElementById("list").innerHTML = html || "Không tìm thấy dữ liệu phù hợp.";
    })
    .catch(err => {
        document.getElementById("list").innerHTML = `<p style="color:red; text-align:center;">Lỗi: ${err.message}</p>`;
    });
</script>

</body>
</html>
